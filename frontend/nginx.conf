server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Фронт и API в одном origin: refresh-cookie не режется SameSite-политикой
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Импорт .xlsm: файл уходит в бэкенд потоком, а не копится сначала на диске nginx.
        proxy_request_buffering off;
    }

    location /healthz {
        proxy_pass http://backend:8000/healthz;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кешируем: после релиза старый index.html ссылается на уже удалённые
    # хэшированные JS — белая страница до Ctrl+F5. SPA-маршруты из try_files выше попадают
    # сюда же внутренним редиректом, поэтому no-store доходит и до них. Заголовки
    # безопасности повторяем: nginx не наследует add_header уровня server, если в этом
    # location есть свой add_header.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Сборки Vite несут хэш содержимого в имени файла — их можно отдавать навечно.
    location ~* \.(js|css|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Без gzip_proxied nginx проксируемые ответы не сжимает вовсе, а весь API — это
    # proxy_pass: годовое overview уходило бы 743 КБ вместо ~60 КБ.
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    # «Отчёт диспетчера» грузится из браузера в base64 (+33 % к весу файла),
    # поэтому 2m хватало примерно на 1.4 МБ отчёта.
    client_max_body_size 16m;
}

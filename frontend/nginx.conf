# Адрес контейнера backend резолвится во время запроса (п. 20 TASKS2.md).
# Прежний `proxy_pass http://backend:8000` без переменной означал «разобрать имя
# один раз при старте nginx»: после `compose up -d --force-recreate backend`
# адрес меняется, nginx шёл в старый IP и отвечал 502 на весь /api — включая
# собственный /healthz, из-за чего deploy.sh отменял успешно прошедший выкат.
# `server ... resolve` внутри upstream даёт то же, что переменная в proxy_pass
# (DNS докера спрашивается заново каждые 10 с), но оставляет живым keepalive:
# с `proxy_pass http://$variable` nginx соединения к бэкенду не переиспользует
# вовсе, и `proxy_http_version 1.1` + `Connection ""` в location были пустым
# расходом.
#
# Подбор пароля отсекается до бэкенда: счётчик приложения живёт в памяти процесса,
# обнуляется перезапуском контейнера и не суммируется между воркерами
# (п. 19–21 TASKS2.md). Зона объяляется в http-контексте — conf.d включается в него.
limit_req_zone $binary_remote_addr zone=statcab_login:10m rate=6r/m;

upstream statcab_backend {
    server backend:8000 resolve;
    # zone обязательна: без общей памяти nginx отказывается стартовать с
    # `server ... resolve` («resolving names at run time requires upstream …
    # to be in shared memory») — 64 КиБ хватает с запасом на один адрес.
    zone statcab_backend 64k;
    # 16 фоновых соединений: больше воркеров uvicorn всё равно не крутятся,
    # а TCP+TLS handshake на каждый запрос API стоил бы времени зря.
    keepalive 16;
    resolver 127.0.0.11 valid=10s ipv6=off;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Общие заголовки проксирования повторяются в каждом location: отдельного
    # файла-сниппета в образе нет, а include между location и limit_req не
    # наследуются. Порядок блоков важен только для читаемости — выигрывает самый
    # длинный префикс, а `^~` ещё и запрещает проверку regex-локейшенов.
    # Проба живости: deploy.sh ждёт зелёный ответ циклом с паузой ~2 с между
    # попытками, поэтому таймауты короткие — висящий 60 с (дефолт) превращал
    # каждую попытку в ожидание, а не в быстрый отказ.
    location = /healthz {
        proxy_pass http://statcab_backend/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Проба готовности: мониторинг ходит в /api/readyz?token=…, а combined-лог
    # пишет $request целиком — секрет лежал бы в `docker logs` при каждом
    # запросе. Отдельный location с access_log off по образцу /healthz;
    # log_format без $args спрятал бы аргументы сразу со всего сервера, а терять
    # их нужно только здесь.
    location = /api/readyz {
        access_log off;
        proxy_pass http://statcab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # /readyz без /api — тот же обработчик бэкенда: FastAPI отдаёт оба пути,
    # прокинем оба, иначе совет мониторинга из доки не отличался бы от 404.
    location = /readyz {
        access_log off;
        proxy_pass http://statcab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Вход — с ограничителем частоты.
    location = /api/auth/login {
        limit_req zone=statcab_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://statcab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Ручные длинные операции: синхронизация с 1С и импорт отчёта диспетчера
    # выполняются прямо в запросе, 60 с на них мало (браузер получал 504, синк
    # тем временем шёл в фоне и встречал повторную кнопку ошибкой «уже идёт»).
    location ^~ /api/admin/sync/run {
        proxy_pass http://statcab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /api/admin/dispatcher/import {
        proxy_pass http://statcab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Файл отчёта уходит в бэкенд потоком, а не копится сначала на диске nginx.
        proxy_request_buffering off;
    }

    # Фронт и API в одном origin: refresh-cookie не режется SameSite-политикой.
    # `^~` — чтобы regex-лок ниже (статика по расширению) не перетянул запросы
    # вида /api/….js на отдачу файлов.
    location ^~ /api/ {
        proxy_pass http://statcab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Импорт .xlsm: файл уходит в бэкенд потоком, а не копится сначала на диске nginx.
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кешируем: после релиза старый index.html ссылается на уже удалённые
    # хэшированные JS — белая страница до Ctrl+F5. SPA-маршруты из try_files выше попадают
    # сюда же внутренним редиректом, поэтому no-store доходит и до них. Заголовки
    # безопасности повторяем: nginx не наследует add_header уровня server, если в этом
    # location есть свой add_header.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    }

    # Сборки Vite несут хэш содержимого в имени файла — их можно отдавать навечно.
    # Заголовки безопасности дублируются: nginx не наследует add_header уровня
    # server в location, где есть собственный add_header.
    location ~* \.(js|css|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Без gzip_proxied nginx проксируемые ответы не сжимает вовсе, а весь API — это
    # proxy_pass: годовое overview уходило бы 743 КБ вместо ~60 КБ.
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    # «Отчёт диспетчера» грузится из браузера в base64 (+33 % к весу файла),
    # поэтому 2m хватало примерно на 1.4 МБ отчёта.
    client_max_body_size 16m;
}

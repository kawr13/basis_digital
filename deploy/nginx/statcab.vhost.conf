# Пример внешнего vhost для nginx, стоящего НА СЕРВЕРЕ (не внутри Docker).
# Кабинет слушает только localhost:8080 (см. docker-compose.host-nginx.yml),
# наружу торчит только этот nginx: 80 → редирект, 443 → TLS → кабинет.
#
# Установка:
#   sudo cp statcab.vhost.conf /etc/nginx/sites-available/statcab
#   sudo ln -s /etc/nginx/sites-available/statcab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d cab.example.ru      # выпустит сертификат и допишет ssl-блок

# --- HTTP: acme-челлендж + редирект на HTTPS --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cab.example.ru;                 # ← свой домен (и A-запись на IP сервера)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;                  # certbot --webroot, если не --nginx
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: TLS-терминация + прокси на фронт кабинета -----------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cab.example.ru;

    # certbot --nginx впишет пути сам; при --webroot/ручном выпуске:
    #ssl_certificate     /etc/letsencrypt/live/cab.example.ru/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/cab.example.ru/privkey.pem;

    # Совпадает с внутренним nginx кабинета (загрузка .xlsm отчётов: файл едет в base64,
    # поэтому 2m хватало примерно на 1.4 МБ отчёта, дальше nginx отвечал 413)
    client_max_body_size 16m;

    # Кабинет проксируют и этим nginx'ом — без внутреннего (см. docs/06, §5.1): тогда
    # сжатие тоже здесь. Без gzip_proxied nginx проксируемые ответы не сжимает вовсе.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;

    location / {
        # Один upstream на всё: внутренний nginx сам разложит /api → backend,
        # / → SPA, /healthz → backend. Больше ничего дублировать не нужно.
        proxy_pass http://127.0.0.1:8080;

        # ВАЖНО: без X-Forwarded-For тротлинг входа (login_throttle_per_ip)
        # считает все попытки с одного 127.0.0.1, а AuditLog теряет реальные IP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Accept-Encoding передаём upstream как есть — так nginx делает по умолчанию,
        # но явно, чтобы при правках не потеряли: бэкенд не сжимает сам, ответ сожмёт
        # этот nginx (gzip_proxied any выше).
        proxy_set_header Accept-Encoding   $http_accept_encoding;

        proxy_read_timeout 60s;                 # как в nginx.conf фронта
        proxy_connect_timeout 5s;
    }
}

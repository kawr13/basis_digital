# Пример внешнего vhost для nginx, стоящего НА СЕРВЕРЕ (не внутри Docker).
# Кабинет слушает только 127.0.0.1:8080 — это дефолтный WEB_PORT (см.
# docker-compose.host-nginx.yml); меняете порт через `./deploy.sh --port N` —
# меняйте и proxy_pass ниже, иначе vhost проксирует в порт, которого нет.
# Наружу торчит только этот nginx: 80 → редирект, 443 → TLS → кабинет.
#
# Установка:
#   sudo cp statcab.vhost.conf /etc/nginx/sites-available/statcab
#   sudo ln -s /etc/nginx/sites-available/statcab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d cab.example.ru      # выпустит сертификат и допишет ssl-блок

# Подбор пароля отсекаем до кабинета (п. 19–21 TASKS2.md): счётчик приложения
# живёт в памяти процесса и обнуляется перезапуском контейнера. Зона объявляется
# в http-контексте — sites-enabled включается именно в него. Имя отличается от
# зоны внутреннего nginx: вдруг оба конфига окажутся в одном nginx.
limit_req_zone $binary_remote_addr zone=statcab_login_ext:10m rate=6r/m;

# --- HTTP: acme-челлендж + редирект на HTTPS --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name cab.example.ru;                 # ← свой домен (и A-запись на IP сервера)

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;                  # certbot --webroot, если не --nginx
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: TLS-терминация + прокси на фронт кабинета -----------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cab.example.ru;

    # certbot --nginx впишет пути сам; при --webroot/ручном выпуске:
    #ssl_certificate     /etc/letsencrypt/live/cab.example.ru/fullchain.pem;
    #ssl_certificate_key /etc/letsencrypt/live/cab.example.ru/privkey.pem;

    # HSTS: без него HTTPS можно «уронить» до открытого HTTP кабинета (п. 21).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Совпадает с внутренним nginx кабинета (загрузка .xlsm отчётов: файл едет в base64,
    # поэтому 2m хватало примерно на 1.4 МБ отчёта, дальше nginx отвечал 413)
    client_max_body_size 16m;

    # Кабинет проксируют и этим nginx'ом — без внутреннего (см. docs/06, §5.1): тогда
    # сжатие тоже здесь. Без gzip_proxied nginx проксируемые ответы не сжимает вовсе.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;

    # Вход — с ограничителем частоты. Точный location выигрывает у `location /`.
    location = /api/auth/login {
        limit_req zone=statcab_login_ext burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Ручные длинные операции (синхронизация с 1С, импорт отчёта, PDF плана)
    # выполняются прямо в запросе: внутренний nginx для них уже даёт 300 с,
    # внешний не имеет права оборвать раньше — браузер получал 504, пока синк
    # продолжался в фоне.
    location ~ ^/api/(admin/sync/run|sync/run|onec/push|admin/dispatcher/import|vessels/plan\.pdf)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        # Один upstream на всё: внутренний nginx сам разложит /api → backend,
        # / → SPA, /healthz → backend. Больше ничего дублировать не нужно.
        proxy_pass http://127.0.0.1:8080;

        # ВАЖНО: без X-Forwarded-For тротлинг входа (login_throttle_per_ip)
        # считает все попытки с одного 127.0.0.1, а AuditLog теряет реальные IP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Accept-Encoding передаём upstream как есть — так nginx делает по умолчанию,
        # но явно, чтобы при правках не потеряли: бэкенд не сжимает сам, ответ сожмёт
        # этот nginx (gzip_proxied any выше).
        proxy_set_header Accept-Encoding   $http_accept_encoding;

        proxy_read_timeout 60s;                 # как в nginx.conf фронта
        proxy_connect_timeout 5s;
    }
}
